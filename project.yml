# Generate the Xcode project with: xcodegen generate   (run inside ios/)
name: ThreeDRooms
options:
  bundleIdPrefix: com.astritzeqiri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: F6S2ZKW8YX
    CODE_SIGN_STYLE: Automatic
targets:
  ThreeDRooms:
    type: application
    platform: iOS
    sources:
      - ThreeDRooms
      - Shared
    dependencies:
      - target: RoomsControl
    settings:
      base:
        PRODUCT_NAME: ThreeDRooms
        PRODUCT_BUNDLE_IDENTIFIER: com.astritzeqiri.threedrooms
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    entitlements:
      path: ThreeDRooms/ThreeDRooms.entitlements
      properties:
        com.apple.developer.networking.wifi-info: true
    info:
      path: ThreeDRooms/Info.plist
      properties:
        CFBundleDisplayName: 3D Rooms
        NSLocationWhenInUseUsageDescription: 3D Rooms checks your Wi-Fi name to use your internal Home Assistant address on your home network.
        NSFaceIDUsageDescription: Use Face ID to unlock your saved 3D Rooms views.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        # Only standard HTTPS/TLS: exempt from export-compliance paperwork.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Home Assistant often runs on plain http inside the home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 3D Rooms connects to your Home Assistant on the local network.
        # Long-press the app icon: "Switch view" (plus up to three views, added at runtime).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: switch
            UIApplicationShortcutItemTitle: Switch view
            UIApplicationShortcutItemIconSymbolName: square.grid.2x2

  RoomsControl:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - RoomsControl
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astritzeqiri.threedrooms.RoomsControl
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: RoomsControl/Info.plist
      properties:
        CFBundleDisplayName: 3D Rooms
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
